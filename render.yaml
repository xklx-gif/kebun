services:
  - type: web
    name: kebun-log-dashboard
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
    disk:
      name: kebun-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
